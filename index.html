<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacksen & Jessica Wedding Invitation</title>
    <link rel="stylesheet" href="styles.css?v=20260911-3">

    <script>
        document.addEventListener("DOMContentLoaded", () => {
           const openBtn = document.getElementById("openInvitationBtn");
            const welcomeSection = document.getElementById("section1");
            const videoOverlay = document.getElementById("videoOverlay");
            const invitationVideo = document.getElementById("invitationVideo");
            const openingAudio = document.getElementById("openingAudio");
            const destinationUrl = "https://withjoy.com/jacksen-and-jessica?utm_medium=web&utm_source=joy&utm_campaign=website_overview_copy";
            let hasRedirected = false;

            const redirectToInvitation = () => {
                if (hasRedirected) return;
                hasRedirected = true;
                window.location.assign(destinationUrl);
            };

            const urlParams = new URLSearchParams(window.location.search);
            const guestName = urlParams.get("guest");
            if (guestName) {
           document.getElementById("guestGreeting").textContent = guestName;
            }


            const startOpeningAudio = () => {
                openingAudio.volume = 0.4;
                return openingAudio.play()
                    .then(() => {
                        enableSoundBtn.hidden = true;
                    })
                    .catch(() => {
                        // Show a one-tap fallback when a phone blocks audible autoplay.
                        enableSoundBtn.hidden = false;
                    });
            };

            startOpeningAudio();
            enableSoundBtn.addEventListener("click", startOpeningAudio);

            openBtn.addEventListener("click", () => {
                openBtn.disabled = true;
                openingAudio.pause();
                openingAudio.currentTime = 0;
                enableSoundBtn.hidden = true;
                welcomeSection.classList.add("fade-out");
                videoOverlay.hidden = false;

                invitationVideo.play().catch(redirectToInvitation);
                setTimeout(() => welcomeSection.remove(), 1000);
            }, { once: true });

            invitationVideo.addEventListener("ended", redirectToInvitation, { once: true });
            invitationVideo.addEventListener("error", redirectToInvitation, { once: true });
        });
    </script>

</head>
<body>
<div class="bg-fixed" aria-hidden="true"></div>
<audio id="openingAudio" autoplay loop preload="auto" aria-hidden="true">
    <source src="https://raw.githubusercontent.com/wongjessicaw-png/jacksen-jessica-wedding-invitation/main/assets/OCEAN%20WAVE.m4a" type="audio/mp4">
</audio>
<button id="enableSoundBtn" class="enable-sound" type="button" hidden>Tap to play sound</button>
    
<div class="container">

    <!-- Section 1: Greetings -->
    <div class="section" id="section1">
        <div class="greeting-content">
            <h1 id="guestGreeting">Andrew</h1>
            <p id="guestInviteLine">We cordially invite you to</p>
            <h2 class="couple-name">Jacksen &amp; Jessica</h2>
            <p class="wedding-label">Wedding</p>
            <img class="elegant-divider" src="assets/Divider_Glasses-removebg-preview.png" alt="" aria-hidden="true">
            <p class="wedding-date">30 January 2027</p>
            <p class="wedding-tagline">It's finally happening.</p>
            <button id="openInvitationBtn">Open Invitation</button>
        </div>
    </div>

    <div class="video-overlay" id="videoOverlay" hidden>
        <video id="invitationVideo" playsinline preload="auto" aria-label="Jacksen and Jessica wedding invitation video">
            <source src="https://raw.githubusercontent.com/wongjessicaw-png/jacksen-jessica-wedding-invitation/main/assets/When%20the%20mountain%20no%20line.mp4" type="video/mp4">
            Your browser does not support invitation video playback.
        </video>

</div>
</body>
</html>
