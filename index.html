<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacksen & Jessica Wedding Invitation</title>
    <link rel="stylesheet" href="styles.css?v=20260911-3">


<script>
document.addEventListener("DOMContentLoaded", () => {
    const openBtn = document.getElementById("openInvitationBtn");
    const welcomeSection = document.getElementById("section1");
    const videoOverlay = document.getElementById("videoOverlay");
    const invitationVideo = document.getElementById("invitationVideo");

    const destinationUrl = "https://withjoy.com/jacksen-and-jessica?utm_medium=web&utm_source=joy&utm_campaign=website_overview_copy";
    let hasRedirected = false;

    const redirectToInvitation = () => {
        if (hasRedirected) return;
        hasRedirected = true;
        window.location.assign(destinationUrl);
    };

    const urlParams = new URLSearchParams(window.location.search);
    const guestName = urlParams.get("guest");
    const greeting = document.getElementById("guestGreeting");

    if (guestName && greeting) {
        greeting.textContent = guestName;
    }

    if (!openBtn || !welcomeSection || !videoOverlay || !invitationVideo) {
        console.error("Invitation elements are missing.");
        return;
    }

    openBtn.addEventListener("click", () => {
        openBtn.disabled = true;
        welcomeSection.classList.add("fade-out");
        videoOverlay.hidden = false;

        invitationVideo.play().catch((error) => {
            console.error("Video playback failed:", error);
            redirectToInvitation();
        });

        setTimeout(() => welcomeSection.remove(), 1000);
    }, { once: true });

    invitationVideo.addEventListener("ended", redirectToInvitation, { once: true });
    invitationVideo.addEventListener("error", redirectToInvitation, { once: true });
});
</script>


</head>
<body>
    <div class="bg-fixed" aria-hidden="true"></div>

<div class="container">

    <!-- Section 1: Greetings -->
    <div class="section" id="section1">
        <div class="greeting-content">
            <p class="wedding-tagline">Hi,</p>
            <h1 id="guestGreeting">Andrew</h1>
            <p class="wedding-tagline">It's finally happening.</p>
            <p class="wedding-date">30 January 2027</p>
            <img class="elegant-divider" src="assets/Divider_Glasses-removebg-preview.png" alt="" aria-hidden="true">
          
            <button id="openInvitationBtn">Open Invitation</button>
        </div>
    </div>

    <div class="video-overlay" id="videoOverlay" hidden>
        <video id="invitationVideo" playsinline preload="auto" aria-label="Jacksen and Jessica wedding invitation video">
            <source src="https://raw.githubusercontent.com/wongjessicaw-png/jacksen-jessica-wedding-invitation/main/assets/Complete%20Video.mp4" type="video/mp4">
            Your browser does not support invitation video playback.
        </video>

</div>
</body>
</html>
